name: Fetch Google Reviews

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:        # Manual trigger from GitHub Actions tab
  push:
    branches: [main]
    paths:
      - 'fetch-reviews.js'  # Re-run if the script itself changes

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Fetch reviews via SerpApi
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: node fetch-reviews.js

      - name: Commit updated reviews if changed
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add reviews-data.json index.html
          git diff --staged --quiet || (git commit -m "Update reviews data" && git push)
